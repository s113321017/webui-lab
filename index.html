<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173c37">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>WKE 教務系統</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-shell">
        <button class="sidebar-backdrop" id="sidebarBackdrop" aria-label="關閉導覽選單" hidden></button>
        <aside class="sidebar" id="sidebar" aria-label="主導覽">
            <a class="brand" href="#dashboard" aria-label="WKE 教務系統首頁">
                <span class="brand-mark" aria-hidden="true">W</span>
                <span class="brand-copy"><strong>WKE</strong><small>教務系統</small></span>
            </a>
            <div class="sidebar-label">工作空間</div>
            <nav class="primary-nav" id="primaryNav" aria-label="教務功能">
                <p class="nav-loading">正在載入功能選單…</p>
            </nav>
            <p class="nav-preview" id="preview" aria-live="polite"></p>
            <div class="sidebar-bottom">
                <span class="status-dot" aria-hidden="true"></span>
                <span>教務服務正常</span>
                <span class="sidebar-version">v1.0</span>
            </div>
        </aside>

        <div class="workspace">
            <header class="topbar">
                <button class="menu-toggle" id="menuToggle" type="button" aria-label="開啟導覽選單" aria-expanded="false" aria-controls="sidebar">
                    <span></span><span></span><span></span>
                </button>
                <div class="breadcrumb"><span>教務管理</span><span class="breadcrumb-separator">/</span><strong id="pageLabel">總覽</strong></div>
                <div class="topbar-actions">
                    <span class="today-label" id="todayLabel"></span>
                    <button class="login-button" id="loginButton" type="button">登入 <span aria-hidden="true">↗</span></button>
                </div>
            </header>

            <main class="main-content" id="mainContent">
                <section class="page-heading" aria-labelledby="pageTitle">
                    <div>
                        <p class="eyebrow">ACADEMIC OPERATIONS</p>
                        <h1 id="pageTitle">教務總覽</h1>
                        <p class="page-subtitle">掌握教學現況與本週重要事項。</p>
                    </div>
                    <div class="term-badge"><span class="term-dot" aria-hidden="true"></span><span id="termLabel">載入學期資訊</span></div>
                </section>

                <section class="content-panel message-demo" id="messageDemo" aria-label="訊息更新示範">
                    <div class="panel-heading">
                        <div><p class="eyebrow">INTERACTION DEMO</p><h2>訊息更新</h2></div>
                        <button class="text-action" id="changeButton" type="button">更新訊息</button>
                    </div>
                    <p id="message">尚未更新</p>
                </section>

                <section class="content-panel detail-demo" id="detailDemo" aria-label="詳細資訊展開示範">
                    <div class="panel-heading">
                        <div><p class="eyebrow">ACCESSIBLE INTERACTION</p><h2>詳細資訊</h2></div>
                        <button class="text-action" id="detailButton" type="button" aria-expanded="false" aria-controls="detailPanel">顯示詳細資訊</button>
                    </div>
                    <div class="detail-content" id="detailPanel" hidden>
                        點擊按鈕即可展開或收合這段詳細資訊。
                    </div>
                </section>

                <section class="metrics-grid" id="metricsGrid" aria-label="教務數據">
                    <p class="content-loading">正在載入教務資料…</p>
                </section>

                <section class="lower-grid" aria-label="近期教務資訊">
                    <article class="content-panel schedule-panel">
                        <div class="panel-heading">
                            <div><p class="eyebrow">THIS WEEK</p><h2>本週課務</h2></div>
                            <button class="text-action" type="button" data-nav-target="timetable">查看課表 <span aria-hidden="true">→</span></button>
                        </div>
                        <div class="schedule-list" id="scheduleList"><p class="content-loading">載入中…</p></div>
                    </article>
                    <article class="content-panel notices-panel">
                        <div class="panel-heading">
                            <div><p class="eyebrow">LATEST UPDATES</p><h2>最新公告</h2></div>
                            <button class="icon-action" type="button" aria-label="更多公告" data-nav-target="announcements">···</button>
                        </div>
                        <div class="notice-list" id="noticeList"><p class="content-loading">載入中…</p></div>
                    </article>
                </section>

                <footer class="page-footer"><span>WKE 教務系統</span><span>教學行政資訊整合平台</span></footer>
            </main>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
    <script src="js/app.js" defer></script>
</body>
</html>
